services:
  # 静态站点：宿主机端口通过环境变量 HOST_PORT 配置（默认 8080）
  web:
    build: .
    image: thermal-diag-workbench:latest
    ports:
      - "${HOST_PORT:-8080}:4173"
    environment:
      PORT: "4173"
      HOST: "0.0.0.0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 6s

  # 一次性校验服务：单元测试 → 类型检查 → 生产构建 → HTTP 冒烟；
  # 正常完成后自行退出，退出码即最终结果（0 成功 / 非 0 失败）。
  # 独立 profile，使 `docker compose up` 只启动站点；用 `docker compose run --rm verify` 触发。
  verify:
    build: .
    image: thermal-diag-workbench:latest
    command: ["sh", "scripts/verify.sh"]
    profiles: ["verify"]
    environment:
      NODE_ENV: "development"
      PORT: "4173"
      HOST: "127.0.0.1"
      BASE_URL: "http://127.0.0.1:4173"
    restart: "no"
