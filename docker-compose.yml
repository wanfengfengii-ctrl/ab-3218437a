services:
  # 静态站点：宿主机端口通过环境变量 HOST_PORT 配置（默认 8080）
  web:
    build:
      context: .
      target: runtime
    image: diagnosis-workbench:latest
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      - PORT=8080
    restart: unless-stopped

  # 一次性校验服务：测试、类型检查、生产构建、HTTP 冒烟；以退出码报告结果
  verify:
    build:
      context: .
      target: build
    image: diagnosis-workbench:verify
    command: ["sh", "./scripts/verify.sh"]
    restart: "no"
